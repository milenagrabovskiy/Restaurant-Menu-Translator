[project]
name = "menu_translator"
version = "0.1.0"
description = "Menu translator app integrated with AWS AI services"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "psycopg[binary]",
    "python-dotenv>=1.0",
    "structlog>=26.1.0",
    "requests>=2.34.2",
    "boto3>=1.43.73"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["menu_translator*"]

[tool.setuptools.package-data]
menu_translator = ["templates/*.html", "static/*.css"]