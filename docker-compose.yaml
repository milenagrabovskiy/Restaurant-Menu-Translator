services:

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: restaurant_menu_docker_db

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_menu_docker_db"]
      interval: 5s
      timeout: 3s
      retries: 5


  api:
    build: .

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:root@db:5432/restaurant_menu_docker_db
      FLASK_APP: menu_translator.app:create_app

    volumes:
      - ${HOME}/.aws:/root/.aws:ro

    ports:
      - "5003:5000"

    depends_on:
      db:
        condition: service_healthy


volumes:
  db-data: